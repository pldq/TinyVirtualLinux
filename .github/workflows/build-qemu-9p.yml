name: Build QEMU with virtio-9p for Windows

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "QEMU target list (comma separated)"
        required: false
        default: "x86_64-softmmu"
        type: string
      configure_args:
        description: "Extra ./configure arguments (appended after the defaults)"
        required: false
        default: ""
        type: string
      jobs:
        description: "Parallel make jobs (empty = number of CPUs)"
        required: false
        default: ""
        type: string
      minimal:
        description: "Minimal build: only virtio-9p/WHPX/slirp, no VNC/SDL/SPICE/vhost and no default devices (every device must be passed with -device)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "qemu-v*"

permissions:
  contents: write

concurrency:
  group: build-qemu-${{ github.ref }}
  cancel-in-progress: true

env:
  QEMU_REPO: https://github.com/qemu/qemu.git
  STAGE: C:\qemu-stage
  PKG: C:\qemu-pkg
  ARTIFACT: qemu-9p-windows-x86_64.zip
  TARGETS: ${{ github.event.inputs.targets }}
  CONFIGURE_ARGS: ${{ github.event.inputs.configure_args }}
  JOBS: ${{ github.event.inputs.jobs }}
  MINIMAL: ${{ github.event.inputs.minimal }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Configure git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone QEMU at the tag pinned in .gitmodules
        shell: pwsh
        run: |
          $match = Select-String -Path .gitmodules -Pattern '^\s*branch\s*=\s*(.+)$'
          if (-not $match) { throw "no branch (QEMU release tag) entry in .gitmodules" }
          $tag = $match.Matches[0].Groups[1].Value.Trim()
          Write-Host "==> Building QEMU tag: $tag"

          if (Test-Path qemu) { Remove-Item qemu -Recurse -Force }
          git clone --depth 1 --branch $tag $env:QEMU_REPO qemu
          if ($LASTEXITCODE -ne 0) { throw "failed to clone $env:QEMU_REPO at $tag" }
          $head = (git -C qemu rev-parse HEAD).Trim()
          Write-Host "==> HEAD: $head ($(git -C qemu describe --tags --always))"

          # The gitlink recorded in the outer repo should match the tag commit.
          $gitlink = ((git ls-tree HEAD qemu) -split '\s+')[2]
          if ($gitlink -and $gitlink -ne $head) {
            Write-Warning "submodule gitlink $gitlink differs from tag commit $head"
          }

      - name: Apply Windows 9P patches
        shell: pwsh
        run: |
          $patches = @(Get-ChildItem patches -Filter *.patch | Sort-Object Name)
          if ($patches.Count -eq 0) { throw "no *.patch files found under patches/" }
          foreach ($p in $patches) {
            Write-Host "==> applying $($p.Name)"
            git -C qemu apply --whitespace=nowarn --verbose $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "failed to apply $($p.Name)" }
          }

      - name: Setup MSYS2 (UCRT64) with build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            diffutils
            python
            perl
            ccache
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: C:\ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure QEMU (virtfs/9P, WHPX, slirp)
        shell: msys2 {0}
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: /c/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          set -euo pipefail
          src="$(cygpath -u "$GITHUB_WORKSPACE")/qemu"
          targets="${TARGETS:-x86_64-softmmu}"
          extra=()
          if [ "${MINIMAL:-false}" = "true" ]; then
            echo "==> minimal build: disabling optional subsystems and default devices"
            extra+=(
              --without-default-devices
              --disable-sdl
              --disable-gtk
              --disable-opengl
              --disable-virglrenderer
              --disable-vnc
              --disable-spice
              --disable-curses
              --disable-xen
              --disable-guest-agent
              --disable-vhost-net
              --disable-vhost-user
              --disable-vhost-vdpa
              --disable-capstone
              --disable-modules
              --disable-docs
              --disable-plugins
            )
          fi
          echo "==> target list: $targets"
          echo "==> extra configure args: ${CONFIGURE_ARGS:-<none>}"
          rm -rf /c/qemu-build
          mkdir -p /c/qemu-build
          cd /c/qemu-build
          "$src/configure" \
            --target-list="$targets" \
            --prefix=C:/qemu-install \
            --enable-virtfs \
            --enable-whpx \
            --enable-slirp \
            "${extra[@]}" \
            ${CONFIGURE_ARGS:-}

      - name: Build QEMU
        shell: msys2 {0}
        env:
          CCACHE_DIR: /c/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          set -euo pipefail
          cd /c/qemu-build
          make -j"${JOBS:-$(nproc)}"
          ccache -s || true

      - name: Install and assemble portable package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd /c/qemu-build
          rm -rf /c/qemu-install /c/qemu-pkg
          mkdir -p /c/qemu-pkg/share

          # --prefix=C:/qemu-install keeps the Windows path intact (a POSIX
          # prefix such as "/" is translated by MSYS2 into the MSYS root).
          # On Windows QEMU installs the executables and a flat share/ tree
          # directly under that prefix, which is also what the relocatable
          # runtime layout (exe_dir/...) expects.
          make install

          if [ ! -d /c/qemu-install/share ]; then
            echo "ERROR: install prefix was not populated as expected"
            ls -la /c/qemu-install 2>/dev/null || true
            exit 1
          fi

          # Collect the mingw runtime DLLs transitively by reading each PE
          # import table directly, mirroring QEMU's own installer helper
          # (scripts/nsis.py): objdump -p -> "DLL Name:", resolve against the
          # glib bindir, recurse. ldd output is locale/path dependent and
          # silently reports "not found", which used to drop dependencies
          # such as libbz2-1.dll from the package.
          dll_dir="$(pkg-config --variable=bindir glib-2.0 2>/dev/null || true)"
          if [ -n "$dll_dir" ]; then
            # pkg-config returns a native Windows path (D:/...); convert it so
            # cp/objdump in this shell all agree on the same location.
            dll_dir="$(cygpath -u "$dll_dir" 2>/dev/null || printf '%s' "$dll_dir")"
          fi
          if [ ! -d "$dll_dir" ]; then
            dll_dir="/ucrt64/bin"
          fi
          echo "==> DLL search path: $dll_dir"

          # Walk the import table of $1 and copy every mingw-provided
          # dependency it references (recursively). The exe itself is copied
          # by the caller, so this only handles dependencies.
          collect_deps() {
            local f="$1"
            local d src
            for d in $(objdump -p "$f" 2>/dev/null | awk '/DLL Name:/ {print $3}'); do
              src="$dll_dir/$d"
              [ -f "$src" ] || continue
              if [ -f "/c/qemu-pkg/$d" ]; then
                continue
              fi
              cp -n "$src" /c/qemu-pkg/ || { echo "WARN: cannot copy $src"; continue; }
              collect_deps "$src"
            done
          }

          for exe in /c/qemu-install/*.exe; do
            [ -f "$exe" ] || continue
            cp -n "$exe" /c/qemu-pkg/
            strip --strip-unneeded /c/qemu-pkg/"$(basename "$exe")" 2>/dev/null || true
            collect_deps "$exe"
          done
          echo "==> collected $(ls /c/qemu-pkg/*.dll 2>/dev/null | wc -l) DLLs from $dll_dir"

          # Firmware, keymaps, DTB and edk2 descriptors (flat share/ layout)
          cp -rn /c/qemu-install/share/. /c/qemu-pkg/share/

          # Fail early if any mingw-provided dependency is still missing.
          missing=0
          for exe in /c/qemu-pkg/*.exe; do
            [ -f "$exe" ] || continue
            for d in $(objdump -p "$exe" 2>/dev/null | awk '/DLL Name:/ {print $3}'); do
              if [ -f "$dll_dir/$d" ] && [ ! -f "/c/qemu-pkg/$d" ]; then
                echo "MISSING dependency: $d (needed by $(basename "$exe"))"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: package is missing runtime DLLs"
            exit 1
          fi

          echo "==> package contents"
          ls -la /c/qemu-pkg
          echo "dll count: $(ls /c/qemu-pkg/*.dll 2>/dev/null | wc -l)"
          test -f /c/qemu-pkg/share/bios-256k.bin && echo "firmware OK" || echo "WARN: no bios-256k.bin"

      - name: Package ZIP
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP $env:ARTIFACT
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path "$env:PKG\*" -DestinationPath $out -Force
          $size = (Get-Item $out).Length
          Write-Host "==> created $out ($([math]::Round($size/1MB,1)) MB)"
          "ZIP_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        # Artifacts are always delivered as a zip, so upload the package
        # directory itself: extracting the download then yields the flat
        # layout (exe + share/) instead of a zip inside a zip.
        uses: actions/upload-artifact@v4
        with:
          name: qemu-9p-windows-x86_64
          path: ${{ env.PKG }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        # Tag pushes create/update the release for that tag; a manual run
        # keeps a single rolling "qemu-9p-latest" release whose zip is
        # replaced on every successful build.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'qemu-9p-latest' }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'QEMU 9P for Windows (latest)' }}"
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/${{ env.ARTIFACT }}
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
