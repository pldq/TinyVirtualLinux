name: Build 9P-enabled QEMU for Windows

on:
  workflow_dispatch:
    inputs:
      qemu_repo:
        description: "QEMU source repo (fork with Windows 9P patches). Fork into our org and pin for reproducibility."
        required: true
        default: "cmspam/winq-emu-qemu"
      qemu_ref:
        description: "Branch / tag / commit to build"
        required: true
        default: "master"
  push:
    tags:
      - "qemu-v*"

permissions:
  contents: write

concurrency:
  group: build-qemu-${{ github.ref }}
  cancel-in-progress: true

env:
  QEMU_REPO: ${{ github.event.inputs.qemu_repo || 'cmspam/winq-emu-qemu' }}
  QEMU_REF:  ${{ github.event.inputs.qemu_ref  || 'master' }}
  STAGE:     C:\qemu-stage
  PKG:       C:\qemu-pkg
  ARTIFACT:  qemu-9p-windows-x86_64.zip

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout this repo (for the workflow only)
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64) with build deps
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            diffutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Clone QEMU source (${{ env.QEMU_REPO }} @ ${{ env.QEMU_REF }})
        shell: msys2 {0}
        run: |
          set -e
          git clone --depth 1 --branch "$QEMU_REF" "https://github.com/$QEMU_REPO.git" /c/qemu-src
          cd /c/qemu-src
          echo "=== head ==="
          git log -1 --oneline

      - name: Configure QEMU (x86_64-softmmu, virtfs/9P + WHPX + slirp, headless)
        shell: msys2 {0}
        run: |
          set -e
          cd /c/qemu-src
          mkdir -p build && cd build
          ../configure \
            --target-list=x86_64-softmmu \
            --prefix=/ \
            --enable-virtfs \
            --enable-whpx \
            --enable-slirp \
            --disable-sdl \
            --disable-gtk \
            --disable-opengl \
            --disable-virglrenderer \
            --disable-modules \
            --disable-docs \
            --disable-plugins
          echo "=== configure done ==="

      - name: Build QEMU
        shell: msys2 {0}
        run: |
          set -e
          cd /c/qemu-src/build
          make -j"$(nproc)"
          echo "=== build done ==="
          ls -la qemu-system-x86_64.exe

      - name: Install + assemble portable package (exe + DLLs + firmware)
        shell: msys2 {0}
        run: |
          set -e
          cd /c/qemu-src/build
          make install DESTDIR="$STAGE"

          mkdir -p "$PKG" "$PKG/share"
          cp -n "$STAGE/bin/qemu-system-x86_64.exe" "$PKG/"

          # Collect mingw runtime DLLs transitively (only those under /ucrt64/bin)
          declare -A seen
          collect() {
            local f="$1"
            local b; b="$(basename "$f")"
            [ -f "$PKG/$b" ] && return
            cp -n "$f" "$PKG/" 2>/dev/null || return
            for d in $(ldd "$f" 2>/dev/null \
                       | grep -iE '/ucrt64/bin/[^ ]+\.dll' \
                       | sed -E 's#.*(/ucrt64/bin/[^ ]+\.dll).*#\1#'); do
              collect "$d"
            done
          }
          collect "$PKG/qemu-system-x86_64.exe"

          # Firmware / keymaps: make install put them in $STAGE/share/qemu
          cp -rn "$STAGE/share/qemu/." "$PKG/share/"

          echo "=== package contents ==="
          ls -la "$PKG"
          echo "dll count: $(ls "$PKG"/*.dll 2>/dev/null | wc -l)"
          test -f "$PKG/share/bios-256k.bin" && echo "firmware OK" || echo "WARN: no bios-256k.bin"

      - name: Compress package to ZIP (PowerShell)
        shell: pwsh
        run: |
          $pkg = "C:\qemu-pkg"
          $out = "C:\$env:ARTIFACT"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path "$pkg\*" -DestinationPath $out -Force
          $size = (Get-Item $out).Length
          Write-Host "=== created $out ($([math]::Round($size/1MB,1)) MB) ==="

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-9p-windows-x86_64
          path: C:\qemu-9p-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (on tag qemu-v*)
        if: startsWith(github.ref, 'refs/tags/qemu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: C:\qemu-9p-windows-x86_64.zip
          generate_release_notes: true
